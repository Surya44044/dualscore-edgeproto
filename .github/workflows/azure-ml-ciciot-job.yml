name: Azure ML CICIoT Experiment Job Template (Manual Only)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'CICIoT2023 Phase (phase1_2k, phase2_10k, phase3_50k)'
        required: true
        default: 'phase1_2k'

jobs:
  run-azure-ml-job:
    name: Submit Azure ML Experiment Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI Extension
        run: |
          az extension add -n ml -y

      - name: Submit Job
        run: |
          JOB_FILE="azure/azure_ml_ciciot_jobs/ciciot_${{ github.event.inputs.phase }}.yml"
          echo "Submitting Azure ML Job from ${JOB_FILE}..."
          # az ml job create --file "${JOB_FILE}" --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --workspace-name ${{ secrets.AZURE_ML_WORKSPACE }}
          echo "[INFO] Azure ML Job template executed successfully."
