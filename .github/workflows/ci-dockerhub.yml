name: Build Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-dockerhub-main
  cancel-in-progress: true

jobs:
  test-and-publish:
    name: Test Code and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install API Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Compile Python Code
        run: |
          python -m compileall -q src

      - name: Secret Scan
        run: |
          bash scripts/check_no_secrets.sh

      - name: Research Smoke Test
        run: |
          bash scripts/ci_research_smoke.sh

      - name: API Local Test
        run: |
          bash scripts/test_api_local.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dualscore-edgeproto:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dualscore-edgeproto:${{ github.sha }}

      - name: Print Docker Image Details
        run: |
          echo "Docker image pushed successfully:"
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dualscore-edgeproto:latest"
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dualscore-edgeproto:${{ github.sha }}"
