model:
  in_channels: 4
  input_length: 12
  embedding_dim: 32

training:
  batch_size: 256
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  patience: 6
  num_workers: 0
  dtype: float32
  device: cpu
  temperature: 0.5
  margin_open: 1.0
  margin_sep: 0.5
  lambda_open: 0.5
  lambda_sep: 0.01

evaluation:
  threshold_percentile: 99
