version: '3.8'

services:
  inference-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dualscore-edgeproto:local
    container_name: dualscore-edgeproto-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
